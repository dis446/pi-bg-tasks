name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    # A manual run must still come from a tag, never from a branch.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false # a poisoned npm cache must not reach a publish
      # --ignore-scripts: no dependency install script runs with publish rights.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run ci
      - name: Tag matches package version and is on main
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "$GITHUB_REF_NAME is not an ancestor of main" >&2
            exit 1
          fi
      # Trusted Publishing (OIDC): no long-lived token in the repo, no .npmrc
      # _authToken placeholder from setup-node's registry-url to shadow it.
      - name: npm CLI 11.5.1 or newer
        run: npm i -g npm@^11.5.1 --ignore-scripts --no-audit --no-fund && npm --version
      - name: Publish to npm
        run: npm publish --access public
